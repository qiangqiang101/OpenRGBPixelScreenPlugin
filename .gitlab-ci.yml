default:
  interruptible: true

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # Tag for Windows Runner. On GitLab.com (SaaS), use 'saas-windows-medium-amd64'.
  # For self-hosted runners, change this to your runner tag (e.g. 'windows').
  WINDOWS_RUNNER_TAG: "saas-windows-medium-amd64"

stages:
  - build
  - release

# ==============================================================================
# Base Linux Build Template
# ==============================================================================
.build_linux:
  stage: build
  image: docker:24.0.5
  services:
    - name: docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - if [ "$PLATFORM" != "linux/amd64" ]; then docker run --privileged --rm tonistiigi/binfmt --install all; fi
  script:
    - |
      docker run --rm --platform "$PLATFORM" \
        -e QT_PACKAGE="$QT_PACKAGE" \
        -e QMAKE_CMD="$QMAKE_CMD" \
        -e BUILD_DIR="$BUILD_DIR" \
        -e DEBIAN_FRONTEND=noninteractive \
        -v "$CI_PROJECT_DIR:/work" \
        -w /work \
        debian:bookworm \
        bash -lc '
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends build-essential pkg-config "$QT_PACKAGE" libgl1-mesa-dev findutils tar
          cd "$BUILD_DIR"
          "$QMAKE_CMD" PixelScreenPlugin.pro "CONFIG+=release"
          make -j"$(nproc)"
        '
    - |
      set -euo pipefail
      PACKAGE_NAME="${API}-Linux-${ARCH_NAME}"
      PACKAGE_DIR="dist/${PACKAGE_NAME}"
      mkdir -p "${PACKAGE_DIR}"
      PLUGIN="$(find "${BUILD_DIR}" -name "*PixelScreenPlugin*.so" -type f | head -n 1)"
      if [ -z "$PLUGIN" ]; then
        PLUGIN="$(find "${BUILD_DIR}" -name "*.so" -not -path "*/OpenRGB/*" -type f | head -n 1)"
      fi
      if [ -n "$PLUGIN" ]; then cp "$PLUGIN" "${PACKAGE_DIR}/"; fi
      JSON="$(find "${BUILD_DIR}" -name "PixelScreenPlugin.json" -type f | head -n 1)"
      if [ -n "$JSON" ]; then cp "$JSON" "${PACKAGE_DIR}/"; fi
      tar -C "${PACKAGE_DIR}" -czf "dist/${PACKAGE_NAME}.tar.gz" .
  artifacts:
    name: "$API-Linux-$ARCH_NAME"
    paths:
      - dist/$API-Linux-$ARCH_NAME.tar.gz
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# ==============================================================================
# Base Windows Build Template
# ==============================================================================
.build_windows:
  stage: build
  tags:
    - $WINDOWS_RUNNER_TAG
  script:
    - |
      pip install aqtinstall
      python -m aqt install-qt windows desktop $QT_VERSION $QT_ARCH -o C:\Qt
      $qtSubDir = $QT_ARCH -replace 'win64_','' -replace 'win32_',''
      $env:PATH = "C:\Qt\$QT_VERSION\$qtSubDir\bin;$env:PATH"
      
      $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
      $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
      $vcVars = Join-Path $vsPath "VC\Auxiliary\Build\vcvarsall.bat"
      
      cmd /c "`"$vcVars`" $MSVC_ARCH && cd $BUILD_DIR && qmake.exe PixelScreenPlugin.pro `"CONFIG+=release`" && nmake"

      $packageName = "${API}-Windows-${ARCH}"
      $packageDir = "dist/$packageName"
      New-Item -ItemType Directory -Force $packageDir | Out-Null
      $dll = Get-ChildItem "$BUILD_DIR" -Recurse -File -Filter PixelScreenPlugin.dll | Select-Object -First 1
      if (-not $dll) { $dll = Get-ChildItem "$BUILD_DIR" -Recurse -File -Filter *PixelScreenPlugin*.dll | Select-Object -First 1 }
      if ($dll) { Copy-Item $dll.FullName $packageDir }
      $json = Get-ChildItem "$BUILD_DIR" -Recurse -File -Filter PixelScreenPlugin.json | Select-Object -First 1
      if ($json) { Copy-Item $json.FullName $packageDir }
      Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$packageName.zip" -Force
  artifacts:
    name: "$API-Windows-$ARCH"
    paths:
      - dist/$API-Windows-$ARCH.zip
    expire_in: 30 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "web"

# ==============================================================================
