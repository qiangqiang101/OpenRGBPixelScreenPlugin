name: Plugin Builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build-windows:
    name: ${{ matrix.api }} / Windows ${{ matrix.arch }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 4 Windows (x64 and x86 / 32-bit)
          - api: API4
            arch: x64
            qt-version: '5.15.2'
            qt-arch: win64_msvc2019_64
            msvc-arch: x64
            build-dir: API4
          - api: API4
            arch: x86
            qt-version: '5.15.2'
            qt-arch: win32_msvc2019
            msvc-arch: x86
            build-dir: API4
          # API 5 Windows (x64)
          - api: API5
            arch: x64
            qt-version: '6.8.3'
            qt-arch: win64_msvc2022_64
            msvc-arch: x64
            build-dir: API5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt ${{ matrix.qt-version }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          cache: false

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}

      - name: Build plugin
        shell: cmd
        working-directory: ${{ matrix.build-dir }}
        run: |
          qmake.exe PixelScreenPlugin.pro "CONFIG+=release"
          nmake

      - name: Package Windows Zip Artifact
        shell: pwsh
        run: |
          $packageName = "${{ matrix.api }}-Windows-${{ matrix.arch }}"
          $packageDir = "dist/$packageName"
          New-Item -ItemType Directory -Force $packageDir | Out-Null
          $dll = Get-ChildItem "${{ matrix.build-dir }}" -Recurse -File -Filter PixelScreenPlugin.dll | Select-Object -First 1
          if (-not $dll) { $dll = Get-ChildItem "${{ matrix.build-dir }}" -Recurse -File -Filter *PixelScreenPlugin*.dll | Select-Object -First 1 }
          if ($dll) { Copy-Item $dll.FullName $packageDir }
          $json = Get-ChildItem "${{ matrix.build-dir }}" -Recurse -File -Filter PixelScreenPlugin.json | Select-Object -First 1
          if ($json) { Copy-Item $json.FullName $packageDir }
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/$packageName.zip" -Force

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.api }}-Windows-${{ matrix.arch }}
          path: dist/${{ matrix.api }}-Windows-${{ matrix.arch }}.zip

      - name: Publish Release Asset
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.api }}-Windows-${{ matrix.arch }}.zip
          fail_on_unmatched_files: false

  build-linux:
    name: ${{ matrix.api }} / Linux ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # API 4 Linux (amd64, i386, arm64, armhf)
          - api: API4
            platform: linux/amd64
            arch-name: amd64
            qt-package: qtbase5-dev
            qmake-cmd: qmake
            build-dir: API4
          - api: API4
            platform: linux/386
            arch-name: i386
            qt-package: qtbase5-dev
            qmake-cmd: qmake
            build-dir: API4
          - api: API4
            platform: linux/arm64
            arch-name: arm64
            qt-package: qtbase5-dev
            qmake-cmd: qmake
            build-dir: API4
          - api: API4
            platform: linux/arm/v7
            arch-name: armhf
            qt-package: qtbase5-dev
            qmake-cmd: qmake
            build-dir: API4
          # API 5 Linux (amd64, i386, arm64, armhf)
          - api: API5
            platform: linux/amd64
            arch-name: amd64
            qt-package: qt6-base-dev
            qmake-cmd: qmake6
            build-dir: API5
          - api: API5
            platform: linux/386
            arch-name: i386
            qt-package: qt6-base-dev
            qmake-cmd: qmake6
            build-dir: API5
          - api: API5
            platform: linux/arm64
            arch-name: arm64
            qt-package: qt6-base-dev
            qmake-cmd: qmake6
            build-dir: API5
          - api: API5
            platform: linux/arm/v7
            arch-name: armhf
            qt-package: qt6-base-dev
            qmake-cmd: qmake6
            build-dir: API5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable Linux QEMU emulation
        if: matrix.platform != 'linux/amd64'
        run: docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Build plugin in Docker container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          QT_PACKAGE: ${{ matrix.qt-package }}
          QMAKE_CMD: ${{ matrix.qmake-cmd }}
          BUILD_DIR: ${{ matrix.build-dir }}
        run: |
          set -euo pipefail
          docker run --rm --platform "$TARGET_PLATFORM" \
            -e QT_PACKAGE \
            -e QMAKE_CMD \
            -e BUILD_DIR \
            -e HOST_UID="$(id -u)" \
            -e HOST_GID="$(id -g)" \
            -e DEBIAN_FRONTEND=noninteractive \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            debian:bookworm \
            bash -lc '
              set -euo pipefail
              apt-get update
              apt-get install -y --no-install-recommends build-essential pkg-config "$QT_PACKAGE" libgl1-mesa-dev
              cd "$BUILD_DIR"
              "$QMAKE_CMD" PixelScreenPlugin.pro "CONFIG+=release"
              make -j"$(nproc)"
              chown -R "$HOST_UID:$HOST_GID" .
            '

      - name: Package Linux Tarball Asset
        run: |
          set -euo pipefail
          package_name="${{ matrix.api }}-Linux-${{ matrix.arch-name }}"
          package_dir="dist/$package_name"
          mkdir -p "$package_dir"
          plugin="$(find "${{ matrix.build-dir }}" -name "*PixelScreenPlugin*.so" -type f -print -quit)"
          if [ -z "$plugin" ]; then
            plugin="$(find "${{ matrix.build-dir }}" -name "*.so" -not -path "*/OpenRGB/*" -type f -print -quit)"
          fi
          if [ -n "$plugin" ]; then cp "$plugin" "$package_dir/"; fi
          json="$(find "${{ matrix.build-dir }}" -name "PixelScreenPlugin.json" -type f -print -quit)"
          if [ -n "$json" ]; then cp "$json" "$package_dir/"; fi
          tar -C "$package_dir" -czf "dist/$package_name.tar.gz" .

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.api }}-Linux-${{ matrix.arch-name }}
          path: dist/${{ matrix.api }}-Linux-${{ matrix.arch-name }}.tar.gz

      - name: Publish Release Asset
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'release') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.api }}-Linux-${{ matrix.arch-name }}.tar.gz
          fail_on_unmatched_files: false
